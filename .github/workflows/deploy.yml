name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, mas sem cancelar o que já está no ar.
#
# `cancel-in-progress: true` aborta a publicação no meio: a action cancela o
# deployment enquanto o backend do Pages ainda o processa, e o próximo pode
# ficar preso esperando um antecessor que nunca terminou. É a recomendação
# oficial do workflow de Pages, e prevenção — não foi a causa do run de 06/08,
# que não teve run concorrente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O site fica na raiz do domínio personalizado, então o base href não deve ser alterado
      - run: npm run build

      # O Pages não conhece as rotas do Angular: sem isso, abrir um link direto
      # como /title/movie/278 devolve 404. Servir o index.html como página de
      # erro faz o roteador assumir a partir dali.
      - run: cp dist/mdblist-hub/browser/index.html dist/mdblist-hub/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/mdblist-hub/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # O padrão é 10 minutos, e é pouco: a fila do Pages costuma engasgar
          # por vários minutos sem que haja nada errado com o artefato. Abortar
          # cedo não conserta nada — só transforma uma lentidão do serviço em
          # um build vermelho.
          timeout: 1200000
