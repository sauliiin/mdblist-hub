name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O site fica em https://<usuario>.github.io/<repo>/, então o base href
      # precisa apontar para a subpasta do repositório.
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # O Pages não conhece as rotas do Angular: sem isso, abrir um link direto
      # como /title/movie/278 devolve 404. Servir o index.html como página de
      # erro faz o roteador assumir a partir dali.
      - run: cp dist/mdblist-hub/browser/index.html dist/mdblist-hub/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/mdblist-hub/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
