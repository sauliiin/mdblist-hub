<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="gradFull" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#00F3FF" />
      <stop offset="28%" stop-color="#7C5CFF" />
      <stop offset="52%" stop-color="#FF00AA" />
      <stop offset="76%" stop-color="#BFFFFF" />
      <stop offset="100%" stop-color="#00F3FF" />
    </linearGradient>

    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#bloom)">
    <!-- Back Loop: Right side loop -->
    <path d="M 512,512 C 640,320 880,320 880,512 C 880,704 640,704 512,512"
          fill="none"
          stroke="url(#gradFull)"
          stroke-width="96"
          stroke-linecap="round" />

    <!-- Front Loop: Left side loop with overlap over the center -->
    <path d="M 512,512 C 384,320 144,320 144,512 C 144,704 384,704 512,512 C 550,460 600,410 650,380"
          fill="none"
          stroke="url(#gradFull)"
          stroke-width="96"
          stroke-linecap="round" />
          
    <!-- Core highlight line -->
    <path d="M 512,512 C 640,320 880,320 880,512 C 880,704 640,704 512,512 C 384,320 144,320 144,512 C 144,704 384,704 512,512"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="16"
          stroke-linecap="round"
          opacity="0.75" />
  </g>
</svg>