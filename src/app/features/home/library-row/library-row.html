@if (loading() || items().length) {
  <section class="feed" data-row>
    <header class="feed-head shell">
      <h2>{{ heading() }}</h2>
      <p>{{ subheading() }}</p>
    </header>

    <div class="track">
      @if (loading()) {
        @for (s of [1,2,3,4,5,6,7,8]; track $index) {
          <div class="skeleton poster"></div>
        }
      } @else {
        @for (item of items(); track item.id) {
          <app-media-card [item]="item" />
        }
      }
    </div>
  </section>
}
