<div class="viewport">
  <button
    type="button"
    class="nav prev"
    [class.hidden]="atStart()"
    (click)="scrollBy(-1)"
    [attr.aria-label]="'Previous' | i18n">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
  </button>

  <div class="track" #track (scroll)="syncEdges()">
    <ng-content />
  </div>

  <button
    type="button"
    class="nav next"
    [class.hidden]="atEnd()"
    (click)="scrollBy(1)"
    [attr.aria-label]="'Next' | i18n">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
  </button>
</div>
