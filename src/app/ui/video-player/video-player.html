<div
  class="shell"
  tabindex="0"
  (keydown)="onKey($event)"
  (fullscreenchange)="onFullscreenChange()">
  <video
    #media
    class="media"
    [src]="src()"
    autoplay
    playsinline
    (click)="togglePlay()"
    (dblclick)="toggleFullscreen()"
    (play)="onPlay()"
    (pause)="onPause()"
    (ended)="onEnded()"
    (timeupdate)="onTimeUpdate()"
    (progress)="onTimeUpdate()"
    (loadedmetadata)="onLoadedMetadata()"
    (volumechange)="onVolumeChange()"
    (waiting)="waiting.set(true)"
    (playing)="waiting.set(false)"
    (canplay)="waiting.set(false)"
    (error)="playbackError.emit()">
    @if (subtitleUrl(); as vtt) {
      <track kind="subtitles" [src]="vtt" [srclang]="subtitleLang()" [label]="subtitleLabel()" />
    }
  </video>

  <!-- Click target over the video, so the controls below stay clickable. -->
  <div class="curtain" (click)="togglePlay()" (dblclick)="toggleFullscreen()"></div>

  @if (waiting()) {
    <div class="spinner" aria-label="Carregando"></div>
  }

  @if (!playing()) {
    <button type="button" class="big-play" (click)="togglePlay()" aria-label="Reproduzir">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
    </button>
  }

  @if (seekFlash(); as flash) {
    <span class="flash" aria-hidden="true">{{ flash }}</span>
  }

  <!-- ------------------------------------------------------ controls -->
  <div class="bar" [class.hidden]="playing() && !controls()">
    <div
      #track
      class="scrub"
      role="slider"
      tabindex="-1"
      [attr.aria-valuemin]="0"
      [attr.aria-valuemax]="100"
      [attr.aria-valuenow]="progress() * 100"
      aria-label="Progresso"
      (pointerdown)="onScrubStart($event)"
      (pointermove)="onScrubMove($event)"
      (pointerup)="onScrubEnd($event)"
      (pointercancel)="onScrubEnd($event)"
      (pointerleave)="onScrubLeave()">
      <div class="rail">
        <div class="loaded" [style.transform]="'scaleX(' + bufferedRatio() + ')'"></div>
        <div class="played" [style.transform]="'scaleX(' + scrubRatio() + ')'"></div>
      </div>
      <div class="knob" [style.left.%]="scrubRatio() * 100"></div>

      @if (hoverRatio() !== null) {
        <span class="bubble" [style.left.%]="hoverRatio()! * 100">{{ hoverLabel() }}</span>
      }
    </div>

    <div class="buttons">
      <button type="button" class="icon" (click)="togglePlay()"
              [attr.aria-label]="playing() ? 'Pausar' : 'Reproduzir'">
        @if (playing()) {
          <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
        } @else {
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
        }
      </button>

      <div class="volume">
        <button type="button" class="icon" (click)="toggleMute()"
                [attr.aria-label]="muted() ? 'Ativar som' : 'Silenciar'">
          @switch (volumeIcon()) {
            @case ('mute') {
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3l2.5-2.5-1-1L15.5 11 13 8.5l-1 1 2.5 2.5L12 14.5l1 1 2.5-2.5 2.5 2.5 1-1-2.5-2.5z" /></svg>
            }
            @case ('low') {
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm11.5 3a3.5 3.5 0 00-2-3.15v6.3A3.5 3.5 0 0014.5 12z" /></svg>
            }
            @default {
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm11.5 3a3.5 3.5 0 00-2-3.15v6.3A3.5 3.5 0 0014.5 12zM14 3.23v2.06a7 7 0 010 13.42v2.06a9 9 0 000-17.54z" /></svg>
            }
          }
        </button>
        <input
          class="volume-slider"
          type="range"
          min="0"
          max="1"
          step="0.01"
          [value]="muted() ? 0 : volume()"
          [style.--fill]="((muted() ? 0 : volume()) * 100) + '%'"
          (input)="onVolume($event)"
          aria-label="Volume" />
      </div>

      <span class="time">{{ elapsedLabel() }} <i>/</i> {{ durationLabel() }}</span>

      <span class="spacer"></span>

      <button
        type="button"
        class="icon"
        [class.off]="!captionsOn()"
        [disabled]="!hasCaptions()"
        (click)="toggleCaptions()"
        [attr.aria-label]="captionsOn() ? 'Desativar legenda' : 'Ativar legenda'"
        [title]="hasCaptions() ? subtitleLabel() : 'Nenhuma legenda carregada'">
        <svg viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zM7.5 13.5h-1v.5h2v1.5h-2.5a1 1 0 01-1-1v-3a1 1 0 011-1H10v1.5H7.5v1.5zm9 0h-1v.5h2v1.5H15a1 1 0 01-1-1v-3a1 1 0 011-1h2.5v1.5H16v1.5z" /></svg>
      </button>

      <div class="settings">
        <button type="button" class="icon" (click)="settingsOpen.set(!settingsOpen())"
                aria-label="Configurações">
          <svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 000-2l2.1-1.6a.5.5 0 00.1-.6l-2-3.5a.5.5 0 00-.6-.2l-2.5 1a7.3 7.3 0 00-1.7-1l-.4-2.6a.5.5 0 00-.5-.4h-4a.5.5 0 00-.5.4l-.4 2.6a7.3 7.3 0 00-1.7 1l-2.5-1a.5.5 0 00-.6.2l-2 3.5a.5.5 0 00.1.6L4.6 11a7.8 7.8 0 000 2l-2.1 1.6a.5.5 0 00-.1.6l2 3.5a.5.5 0 00.6.2l2.5-1a7.3 7.3 0 001.7 1l.4 2.6a.5.5 0 00.5.4h4a.5.5 0 00.5-.4l.4-2.6a7.3 7.3 0 001.7-1l2.5 1a.5.5 0 00.6-.2l2-3.5a.5.5 0 00-.1-.6L19.4 13zM12 15.5A3.5 3.5 0 1115.5 12 3.5 3.5 0 0112 15.5z" /></svg>
        </button>

        @if (settingsOpen()) {
          <div class="menu">
            <p class="menu-head">Velocidade</p>
            @for (option of speeds; track option) {
              <button type="button" class="menu-item" [class.on]="speed() === option"
                      (click)="setSpeed(option)">
                {{ option === 1 ? 'Normal' : option + 'x' }}
              </button>
            }
          </div>
        }
      </div>

      <button type="button" class="icon" (click)="toggleTheater()"
              [attr.aria-label]="theater() ? 'Sair do modo cinema' : 'Modo cinema'">
        <svg viewBox="0 0 24 24"><path d="M3 7h18v10H3V7zm2 2v6h14V9H5z" /></svg>
      </button>

      <button type="button" class="icon" (click)="toggleFullscreen()"
              [attr.aria-label]="fullscreen() ? 'Sair da tela cheia' : 'Tela cheia'">
        @if (fullscreen()) {
          <svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" /></svg>
        } @else {
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" /></svg>
        }
      </button>
    </div>
  </div>
</div>
